<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="VeriSec Forge patch review demo UI preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="0.52" stop-color="#f1eadc"/>
      <stop offset="1" stop-color="#e6dbc7"/>
    </linearGradient>
    <radialGradient id="warm" cx="0.12" cy="0.08" r="0.45">
      <stop offset="0" stop-color="#d98b2b" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#d98b2b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="green" cx="0.88" cy="0.12" r="0.42">
      <stop offset="0" stop-color="#1f7a5a" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#1f7a5a" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#2d2012" flood-opacity="0.18"/>
    </filter>
    <style>
      .serif { font-family: Georgia, "Times New Roman", serif; }
      .sans { font-family: Verdana, sans-serif; }
      .mono { font-family: Consolas, "Liberation Mono", monospace; }
      .panel { fill: rgba(255,255,255,0.84); stroke: rgba(91,75,53,0.22); stroke-width: 1.2; filter: url(#shadow); }
      .muted { fill: #637083; }
      .ink { fill: #162033; }
      .accent { fill: #d98b2b; }
      .risk { fill: #b23b2e; }
      .safe { fill: #1f7a5a; }
      .line { stroke: #dfd5c6; stroke-width: 1; }
      .chip { fill: #eee3d2; }
      .chip-risk { fill: #f7d8d4; }
      .chip-safe { fill: #d9efe4; }
      .code { fill: #172033; }
      .code-text { fill: #f8ead8; }
    </style>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <rect width="1200" height="760" fill="url(#warm)"/>
  <rect width="1200" height="760" fill="url(#green)"/>

  <rect x="48" y="42" width="710" height="190" rx="30" class="panel"/>
  <text x="82" y="84" class="sans accent" font-size="13" font-weight="700" letter-spacing="2">VERISEC FORGE</text>
  <text x="82" y="134" class="serif ink" font-size="54" font-weight="700" letter-spacing="-2">Patch review demo</text>
  <text x="82" y="172" class="serif muted" font-size="20">Artifact-backed paired-diff decision, evidence support, and caveats.</text>
  <text x="82" y="204" class="sans muted" font-size="13">Not online scanning for arbitrary new code. Built for reviewer orientation and failure analysis.</text>

  <rect x="790" y="42" width="362" height="190" rx="30" class="panel"/>
  <text x="820" y="82" class="sans muted" font-size="12" font-weight="700" letter-spacing="1.4">SELECTED PAIR</text>
  <rect x="820" y="102" width="302" height="42" rx="14" fill="#ffffff" stroke="#dfd5c6"/>
  <text x="838" y="129" class="sans ink" font-size="13">tensorflow - CVE-2022-23565</text>
  <rect x="820" y="160" width="302" height="44" rx="15" fill="#25324d"/>
  <text x="918" y="188" class="sans" fill="#ffffff" font-size="14" font-weight="700">Review Pair</text>

  <rect x="48" y="262" width="1104" height="116" rx="26" class="panel"/>
  <text x="78" y="302" class="sans muted" font-size="13" font-weight="700">PAIR DECISION</text>
  <text x="78" y="334" class="sans ink" font-size="18">riskier: 195389::pairctx</text>
  <text x="356" y="334" class="sans ink" font-size="18">safer: 225086::pairctx</text>
  <text x="620" y="334" class="sans ink" font-size="18">gap: 0.853033</text>
  <text x="805" y="334" class="sans ink" font-size="18">pair-coupled: yes</text>
  <text x="78" y="360" class="sans muted" font-size="12">tensorflow|c2b31ff2d3151acb230edc3f5b1832d2c713a9e0|CVE-2022-23565</text>

  <rect x="48" y="408" width="532" height="292" rx="28" class="panel"/>
  <rect x="48" y="408" width="8" height="292" rx="4" fill="#b23b2e"/>
  <text x="82" y="454" class="serif ink" font-size="32" font-weight="700">Riskier side</text>
  <rect x="82" y="472" width="108" height="27" rx="13" class="chip-risk"/>
  <text x="102" y="490" class="sans risk" font-size="12" font-weight="700">vulnerable</text>
  <rect x="200" y="472" width="100" height="27" rx="13" class="chip"/>
  <text x="219" y="490" class="sans muted" font-size="12" font-weight="700">supported</text>
  <text x="82" y="528" class="sans muted" font-size="12">probability</text>
  <text x="82" y="558" class="sans ink" font-size="28" font-weight="700">91.2%</text>
  <text x="220" y="528" class="sans muted" font-size="12">risk support</text>
  <text x="220" y="558" class="sans ink" font-size="28" font-weight="700">2</text>
  <text x="356" y="528" class="sans muted" font-size="12">direction</text>
  <text x="356" y="558" class="sans ink" font-size="18">removes protection</text>
  <line x1="82" y1="586" x2="548" y2="586" class="line"/>
  <text x="82" y="614" class="sans muted" font-size="12">Evidence window</text>
  <rect x="82" y="630" width="466" height="46" rx="14" class="code"/>
  <text x="100" y="656" class="mono code-text" font-size="13">+ DCHECK(a1_set.find(def.name()) == a1_set.end())</text>

  <rect x="620" y="408" width="532" height="292" rx="28" class="panel"/>
  <rect x="620" y="408" width="8" height="292" rx="4" fill="#1f7a5a"/>
  <text x="654" y="454" class="serif ink" font-size="32" font-weight="700">Safer side</text>
  <rect x="654" y="472" width="70" height="27" rx="13" class="chip-safe"/>
  <text x="675" y="490" class="sans safe" font-size="12" font-weight="700">safe</text>
  <rect x="734" y="472" width="100" height="27" rx="13" class="chip"/>
  <text x="753" y="490" class="sans muted" font-size="12" font-weight="700">supported</text>
  <text x="654" y="528" class="sans muted" font-size="12">probability</text>
  <text x="654" y="558" class="sans ink" font-size="28" font-weight="700">5.9%</text>
  <text x="792" y="528" class="sans muted" font-size="12">safety support</text>
  <text x="792" y="558" class="sans ink" font-size="28" font-weight="700">2</text>
  <text x="938" y="528" class="sans muted" font-size="12">direction</text>
  <text x="938" y="558" class="sans ink" font-size="18">adds protection</text>
  <line x1="654" y1="586" x2="1120" y2="586" class="line"/>
  <text x="654" y="614" class="sans muted" font-size="12">Evidence window</text>
  <rect x="654" y="630" width="466" height="46" rx="14" class="code"/>
  <text x="672" y="656" class="mono code-text" font-size="13">+ if (a1_set.find(def.name()) != a1_set.end())</text>

  <text x="64" y="732" class="sans muted" font-size="13">Caveat: evidence windows are heuristic pseudo-localization outputs; final evidence labels require independent adjudication.</text>
</svg>
