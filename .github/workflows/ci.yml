name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  research-smoke:
    name: Research smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU tensor test dependency
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install package
        run: python -m pip install -e ".[dev,source-audit]"

      - name: Check whitespace
        run: git diff --check

      - name: Run regression tests
        run: python -m pytest -q

      - name: Run offline adapter demonstration
        run: python scripts/run_offline_demo.py --output outputs/offline-demo

      - name: Validate retained reproducibility manifest
        run: >-
          python scripts/build_reproducibility_bundle.py
          --manifest reproducibility/veripatch_external_smoke_manifest.json
          --check-only
