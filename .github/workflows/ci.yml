name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  research-smoke:
    name: Research smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install locked Python 3.11 environment
        run: |
          python -m pip install -r requirements/py311-dev.lock
          python -m pip install -e . --no-deps

      - name: Check whitespace
        run: git diff --check

      - name: Run focused research smoke tests
        run: >-
          python -m pytest -q
          tests/test_veripatch_external_adapter.py
          tests/test_ci_smoke_contract.py
          tests/test_paper_artifacts.py
          tests/test_report_index.py
          tests/test_reproducibility_bundle.py

      - name: Validate retained reproducibility manifests
        run: |
          python scripts/build_reproducibility_bundle.py --manifest reproducibility/veripatch_external_smoke_manifest.json --check-only
          python scripts/build_reproducibility_bundle.py --manifest reproducibility/current_training_synthesis_manifest.json --include-generated --check-only
          python scripts/build_reproducibility_bundle.py --manifest reproducibility/repair_criteria_reports_manifest.json --include-generated --check-only
