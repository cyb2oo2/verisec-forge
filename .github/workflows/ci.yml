name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  research-smoke:
    name: Research smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Check whitespace
        run: git diff --check

      - name: Run focused research smoke tests
        run: >-
          python -m pytest -q
          tests/test_veripatch_external_adapter.py
          tests/test_ci_smoke_contract.py
          tests/test_paper_artifacts.py
          tests/test_report_index.py
          tests/test_reproducibility_bundle.py

      - name: Validate retained reproducibility manifest
        run: >-
          python scripts/build_reproducibility_bundle.py
          --manifest reproducibility/veripatch_external_smoke_manifest.json
          --check-only
