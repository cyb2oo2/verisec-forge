# Example: path-filtered research job (smoke only — no training)
# Copy patterns into a real workflow under .github/workflows/ as needed.

name: Example Path Filtered Smoke

on:
  pull_request:
    paths:
      - "src/vrf/**"
      - "tests/**"
      - "reproducibility/**"

permissions:
  contents: read

concurrency:
  group: example-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: >-
          python -m pytest -q
          tests/test_ci_smoke_contract.py
          tests/test_reproducibility_bundle.py
